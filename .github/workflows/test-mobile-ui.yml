      - "grade2-science.js"
      - "grade2-mixed-quest.html"
      - "grade3-preview.html"
      - "grade3-preview-data.js"
      - "grade3-preview.js"
      - "grade3-english.html"
      - "grade3-english-data.js"
      - "grade3-english.js"
      - "grade3-science.html"
      - "grade3-science-data.js"
      - "grade3-science.js"
      - "grade3-mixed-quest.html"
      - "grade3-mixed-quest.js"
      - "scripts/test-grade3-mixed.cjs"
      - "grade2-mixed-quest.js"
      - "fractions-lab.html"
      - "fractions-lab.js"
      - "scripts/test-grade2-mixed.cjs"
      - "scripts/test-grade2-english.cjs"
      - "scripts/check-learning-content.cjs"
      - "parent-progress.html"
      - "parent-report.html"
      - "parent-report.js"
      - "scripts/test-parent-report.cjs"
      - "privacy.html"
      - "privacy-controls.js"
      - "ten-frame-lab.html"
      - "place-value-lab.html"
      - "number-bonds.html"
      - "drawing-studio.html"
      - "drawing-studio.css"
      - "drawing-studio.js"
      - "daily-discovery.html"
      - "story-garden.html"
      - "family-learning-plan.html"
      - "clock-time-lab.html"
      - "measurement-explorer.html"
      - "activity-library.js"
      - "maths-thinking.html"
      - "maths-thinking.js"
      - "math-story-village.html"
      - "qatar-mini-market.html"
      - "qatar-mini-market.js"
      - "science-sort.html"
      - "science-sort.js"
      - "international-benchmark.html"
      - "scripts/test-mega-upgrade.cjs"
      - "foundation-check.html"
      - "foundation-check.js"
      - "practice-path.html"
      - "practice-path.js"
      - "activity-data.js"
      - "activity-library.js"
      - "scripts/test-mobile-ui.cjs"
      - "scripts/test-pronunciation-review.cjs"
      - ".github/workflows/test-mobile-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-mobile-ui
  cancel-in-progress: true

jobs:
  test-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install a browser for real mobile testing
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run app on a temporary localhost server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lla-ui-test-server.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8765/phonics-adventure.html >/dev/null

      - name: Test actual interactive game and both-language recording links
        run: |
          node scripts/test-mobile-ui.cjs
          node scripts/test-pronunciation-review.cjs
          node scripts/test-mega-upgrade.cjs
          node scripts/test-grade2-english.cjs
          node scripts/test-grade2-mixed.cjs
          node scripts/test-grade3-mixed.cjs
          node scripts/test-parent-report.cjs
