name: Test mobile reading and audio

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "curriculum.js"
      - "voice-test.html"
      - "phonics-adventure.html"
      - "phonics-adventure.css"
      - "phonics-adventure.js"
      - "sound-detective.js"
      - "match-learn.html"
      - "bus-voice-check.html"
      - "audio-review.html"
      - "picture-memory.html"
      - "star-journey.html"
      - "activity-library.html"
      - "grades-roadmap.html"
      - "activity-data.js"
      - "activity-library.js"
      - "scripts/test-mobile-ui.cjs"
      - ".github/workflows/test-mobile-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-mobile-ui
  cancel-in-progress: true

jobs:
  test-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install a browser for real mobile testing
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run app on a temporary localhost server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lla-ui-test-server.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8765/phonics-adventure.html >/dev/null

      - name: Test actual interactive game and both-language recording links
        run: node scripts/test-mobile-ui.cjs
