name: Validate app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check navigation.js
          node --check privacy-controls.js
          node --check curriculum.js
          node --check sw.js
          node --check phonics-adventure.js
          node --check sound-detective.js
          node --check activity-data.js
          node --check activity-library.js
          node --check grade2-pilot-data.js
          node --check grade2-pilot.js
          node --check grade2-english-data.js
          node --check grade2-english.js
          node --check grade2-science-data.js
          node --check grade2-science.js
          node --check grade2-mixed-quest.js
          node --check fractions-lab.js
          node --check scripts/check-learning-content.cjs
          node --check learning-passport.js
          node --check drawing-studio.js
          node --check scripts/check-app-security.cjs
          node scripts/check-app-security.cjs

      - name: Verify required PWA files
        run: |
          test -f index.html
          test -f navigation.js
          test -f privacy.html
          test -f privacy-controls.js
          test -f styles.css
          test -f app.js
          test -f curriculum.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f phonics-adventure.html
          test -f phonics-adventure.css
          test -f phonics-adventure.js
          test -f sound-detective.js
          test -f learning-passport.html
          test -f learning-passport.js
          test -f drawing-studio.html
          test -f drawing-studio.css
          test -f drawing-studio.js
          test -f place-value-lab.html
          test -f number-bonds.html
          test -f activity-library.html
          test -f activity-data.js
          test -f activity-library.js
          test -f grade2-pilot.html
          test -f grade2-pilot-data.js
          test -f grade2-pilot.js
          test -f grade2-english.html
          test -f grade2-english-data.js
          test -f grade2-english.js
          test -f grade2-science.html
          test -f grade2-mixed-quest.html
          test -f grade2-mixed-quest.js
          test -f fractions-lab.html
          test -f fractions-lab.js
          test -f grade2-science-data.js
          test -f grade2-science.js
          test -f scripts/check-learning-content.cjs
          test -f parent-progress.html
          test -f pronunciation-review.html
          test -f math-story-village.html
          test -f international-benchmark.html
          test -f scripts/test-mega-upgrade.cjs

      - name: Verify core app wiring
        run: |
          grep -q 'curriculum.js' index.html
          grep -q 'app.js' index.html
          grep -q 'styles.css' index.html
          grep -q 'LLA_CURRICULUM' curriculum.js
          grep -q 'sound-detective.js' phonics-adventure.html
          grep -q 'soundDetective' phonics-adventure.html
          grep -q 'serviceWorker' app.js
          grep -q 'activity-library.html' index.html
          grep -q 'activity-data.js' activity-library.html
          grep -q 'pronunciation-review.html' index.html
          grep -q 'math-story-village.html' index.html
          grep -q 'international-benchmark.html' grades-roadmap.html

      - name: Check Grade 1 and Grade 2 learning content and answers
        run: node scripts/check-learning-content.cjs

      - name: Install audio inspector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Check both languages' recorded audio
        run: |
          python3 -m py_compile scripts/check_audio_assets.py
          python3 scripts/check_audio_assets.py
          python3 scripts/audit_curriculum_audio.py

      - name: Report validation failure as GitHub issue
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="Automated validation failure"
          existing=$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          body="The automatic Little Learners Academy validation failed after commit \`$SHA\`.

          Workflow run: $RUN_URL

          This issue is created automatically so the problem is not missed. Review the failed workflow steps before making further releases."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
