name: Grade 2 four-skills pilot

on:
  pull_request:
    paths:
      - "grade2-four-skills.html"
      - "grade2-four-skills.js"
      - "grade2-four-skills-data.js"
      - "grade2-phonics-pathway.html"
      - "grade2-phonics-pathway.js"
      - "grade2-educator-review.html"
      - "grade2-educator-review.js"
      - "scripts/test-grade2-four-skills.cjs"
      - "scripts/check-grade2-four-skills.cjs"
      - "scripts/test-grade2-phonics-pathway.cjs"
      - "scripts/test-grade2-educator-review.cjs"
      - "grade2-teacher-preview-index.html"
      - "GRADE2-TEACHER-PREVIEW-GUIDE.md"
      - "scripts/build-grade2-teacher-preview.cjs"
      - "scripts/test-grade2-teacher-preview.cjs"
      - "school-updates.html"
      - "school-updates.js"
      - "school-updates-data.js"
      - "index.html"
      - "choose-grade.html"
      - "scripts/test-school-updates.cjs"
      - ".github/workflows/grade2-four-skills.yml"
  push:
    branches: [main, feature/grade2-four-skills-pilot-20261016]
    paths:
      - "grade2-four-skills.html"
      - "grade2-four-skills.js"
      - "grade2-four-skills-data.js"
      - "grade2-phonics-pathway.html"
      - "grade2-phonics-pathway.js"
      - "grade2-educator-review.html"
      - "grade2-educator-review.js"
      - "scripts/test-grade2-four-skills.cjs"
      - "scripts/check-grade2-four-skills.cjs"
      - "scripts/test-grade2-phonics-pathway.cjs"
      - "scripts/test-grade2-educator-review.cjs"
      - "grade2-teacher-preview-index.html"
      - "GRADE2-TEACHER-PREVIEW-GUIDE.md"
      - "scripts/build-grade2-teacher-preview.cjs"
      - "scripts/test-grade2-teacher-preview.cjs"
      - "school-updates.html"
      - "school-updates.js"
      - "school-updates-data.js"
      - "index.html"
      - "choose-grade.html"
      - "scripts/test-school-updates.cjs"
      - ".github/workflows/grade2-four-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade2-four-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source syntax and original activity data
        run: |
          node --check grade2-four-skills.js
          node --check grade2-four-skills-data.js
          node --check grade2-phonics-pathway.js
          node --check grade2-educator-review.js
          node --check scripts/test-grade2-educator-review.cjs
          node --check scripts/build-grade2-teacher-preview.cjs
          node --check scripts/test-grade2-teacher-preview.cjs
          node --check school-updates.js
          node --check school-updates-data.js
          node --check scripts/test-school-updates.cjs
          node scripts/check-grade2-four-skills.cjs
      - name: Build isolated teacher-preview package
        run: node scripts/build-grade2-teacher-preview.cjs
      - name: Install Chromium for mobile and tablet test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local test site and interactive browser regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/g2-four-skills-test.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/grade2-four-skills.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-grade2-four-skills.cjs
          node scripts/test-grade2-phonics-pathway.cjs
          node scripts/test-grade2-educator-review.cjs
          node scripts/test-grade2-teacher-preview.cjs
          node scripts/test-school-updates.cjs
      - name: Save downloadable teacher-preview package (not a hosted website)
        uses: actions/upload-artifact@v4
        with:
          name: grade2-teacher-preview
          path: grade2-teacher-preview-package/
          retention-days: 7
          if-no-files-found: error
