name: Generate Arabic audio

on:
  push:
    branches: [main]
    paths:
      - "audio/ar/source.json"
      - "scripts/generate_neural_arabic.py"
      - ".github/workflows/generate-arabic-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-arabic-audio
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free neural speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install "piper-tts==1.7.0"

      - name: Download Arabic neural voice model (temporary on runner)
        run: |
          mkdir -p /tmp/lla-neural-voice
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium"
          curl --fail --location --retry 3 --silent --show-error "$base/ar_JO-kareem-medium.onnx" -o /tmp/lla-neural-voice/ar_JO-kareem-medium.onnx
          curl --fail --location --retry 3 --silent --show-error "$base/ar_JO-kareem-medium.onnx.json" -o /tmp/lla-neural-voice/ar_JO-kareem-medium.onnx.json
          test $(stat -c%s /tmp/lla-neural-voice/ar_JO-kareem-medium.onnx) -gt 10000000

      - name: Replace robotic audio with neural boy/girl-style MP3s
        run: python scripts/generate_neural_arabic.py

      - name: Validate generated recordings
        run: |
          python - <<'PY'
          import json,pathlib
          data=json.loads(pathlib.Path("audio/ar/source.json").read_text(encoding="utf-8"))
          paths=[pathlib.Path(f"audio/ar/{lesson}-{item['id']}-{gender}.mp3")
                 for lesson,items in data.items() for item in items for gender in ("girl","boy")]
          missing=[str(p) for p in paths if not p.is_file() or p.stat().st_size < 512]
          if missing:raise RuntimeError(f"Missing Arabic recordings: {missing}")
          print("Checked",len(paths),"neural Arabic recordings")
          PY

      - name: Commit changed lesson audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/ar/*.mp3
          if git diff --cached --quiet; then
            echo "Audio already current"
          else
            git commit -m "Replace robotic audio with clearer neural lesson narration"
            git pull --rebase origin main
            git push origin main
          fi
