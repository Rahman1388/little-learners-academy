name: Generate Arabic audio

on:
  push:
    branches: [main]
    paths:
      - "audio/ar/source.json"
      - ".github/workflows/generate-arabic-audio.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arabic speech tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Generate offline Arabic phonics audio
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, tempfile

          source = json.loads(pathlib.Path("audio/ar/source.json").read_text(encoding="utf-8"))
          out = pathlib.Path("audio/ar")
          out.mkdir(parents=True, exist_ok=True)

          def make(text, target, speed, pitch):
              with tempfile.NamedTemporaryFile(suffix=".wav", delete=False) as tmp:
                  wav = pathlib.Path(tmp.name)
              subprocess.run([
                  "espeak-ng","-v","ar","-s",str(speed),"-p",str(pitch),
                  "-a","180","-w",str(wav),text
              ], check=True)
              subprocess.run([
                  "ffmpeg","-y","-loglevel","error","-i",str(wav),
                  "-codec:a","libmp3lame","-q:a","4",str(target)
              ], check=True)
              wav.unlink(missing_ok=True)

          for lesson_id, items in source.items():
              for item in items:
                  base = f"{lesson_id}-{item['id']}"
                  make(item["text"], out / f"{base}-girl.mp3", 118, 66)
                  make(item["text"], out / f"{base}-boy.mp3", 116, 48)
          PY

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/ar/*.mp3
          if git diff --cached --quiet; then
            echo "No audio changes"
          else
            git commit -m "Generate offline Arabic lesson audio"
            git pull --rebase origin main
            git push origin main
          fi
