name: Educator mobile review flow
on:
  pull_request:
    paths:
      - 'teacher-feedback.html'
      - 'teacher-feedback.js'
      - 'scripts/test-educator-quickstart.cjs'
      - 'scripts/test-educator-quickstart-browser.cjs'
      - '.github/workflows/educator-mobile-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  educator-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate educator review content and privacy
        run: |
          node --check teacher-feedback.js
          node --check scripts/test-educator-quickstart.cjs
          node --check scripts/test-educator-quickstart-browser.cjs
          node scripts/test-educator-quickstart.cjs
      - name: Install mobile browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test educator review flow at phone sizes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lla-educator-review.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/teacher-feedback.html >/dev/null && break
            sleep 1
          done
          node scripts/test-educator-quickstart-browser.cjs
